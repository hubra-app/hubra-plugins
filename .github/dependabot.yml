# Keeps the pinned actions current (the comment after each sha says the version).
# Add the repo's own ecosystem below (pip, npm, docker, ...).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

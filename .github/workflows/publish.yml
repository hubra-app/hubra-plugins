name: Publish the Marketplace

# Reads every plugin repository in plugins.yaml, checks each release's signature
# and checksum, writes index.json signed with the index key and publishes it
# with GitHub Pages:
#   https://plugins.hubra.club/index.json
# Then downloads that index and every archive it offers and checks them the way
# a Hubra does (flask plugins check).
# Runs on changes here, every hour (new releases and new plugin repositories),
# by hand, and when a plugin repository sends a "plugin-released" dispatch.
#
# Keys have a purpose. The plugins are signed with the plugin key in their own
# repositories; this repository signs only the index, with the index key
# (Hubra's keys/official/index/), and lists the plugin key in it. So the job
# that runs every hour holds no key whose signature runs code. Only the index
# job sees the key, in the GitHub environment "plugin-signing", and that job
# runs no npm and no third-party action, only Hubra's backend and its locked
# Python packages.
#
# Until Hubra ships an index key, the plugin key signs the index too (the old
# format, HUBRA_SIGNING_KEY); the job switches by itself once it does.
#   index    environment "plugin-signing": builds and signs index.json
#   deploy   pages: write, no signing key: publishes it
#   check    no signing key: verifies what plugins.hubra.club serves
#
# Secrets (environment secrets of "plugin-signing" in this repository, not
# organisation or repository secrets, which every job could read; limit the
# environment to the branch main, with no required reviewer: it runs every hour):
#   HUBRA_INDEX_KEY     the private key (PEM) of keys/official/index/*.pub
#   HUBRA_SIGNING_KEY   old format only, until Hubra ships an index key: the
#                       private key of Hubra.pub. Delete it once the index
#                       key is in use.
#   HUBRA_READ_TOKEN    only while hubra-app/hubra is private: a token that can
#                       read it (Contents: read)
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  INDEX_URL: https://plugins.hubra.club/index.json

jobs:
  index:
    runs-on: ubuntu-24.04
    environment: plugin-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hubra-app/hubra
          path: hubra
          sparse-checkout: app/backend
          token: ${{ secrets.HUBRA_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --no-deps -r hubra/app/backend/requirements.lock
      - name: Build the signed index
        working-directory: hubra/app/backend
        env:
          FLASK_APP: "hubra:create_app()"
          INDEX_KEY: ${{ secrets.HUBRA_INDEX_KEY }}
          SIGNING_KEY: ${{ secrets.HUBRA_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          key="$RUNNER_TEMP/key.pem"
          trap 'rm -f "$key"' EXIT
          # Which key signs the index: the index key once Hubra ships one,
          # else (old format) the plugin key. Refuse any other key.
          mode=$(python - <<'PY'
          from hubra.core.plugins.trust import official_keys
          print("separate" if set(official_keys("index")) - set(official_keys("plugins")) else "single")
          PY
          )
          if [ "$mode" = separate ]; then
            if [ -z "$INDEX_KEY" ]; then echo "::error::add HUBRA_INDEX_KEY to the plugin-signing environment"; exit 1; fi
            (umask 077 && printf '%s\n' "$INDEX_KEY" > "$key")
          else
            if [ -z "$SIGNING_KEY" ]; then echo "::error::add HUBRA_SIGNING_KEY to the plugin-signing environment"; exit 1; fi
            (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          fi
          python - "$key" "$mode" <<'PY'
          import sys
          from cryptography.hazmat.primitives import serialization
          from hubra.core.plugins.trust import key_id, official_keys
          pub = serialization.load_pem_private_key(open(sys.argv[1], "rb").read(), None).public_key()
          want = official_keys("index")
          if key_id(pub) not in want:
              sys.exit(f"the key is {key_id(pub)}, not the official index key {', '.join(want)}")
          if sys.argv[2] == "separate" and key_id(pub) in official_keys("plugins"):
              sys.exit("the index key is also a plugin key; a key has one purpose")
          PY
          args=()
          if [ "$mode" = separate ]; then
            for pub in hubra/core/plugins/keys/official/*.pub; do args+=(--plugin-key "$pub"); done
          fi
          flask plugins build-index "$GITHUB_WORKSPACE/plugins.yaml" "$GITHUB_WORKSPACE/site" --key "$key" "${args[@]}"
          cp "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/site/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          retention-days: 1

  deploy:
    needs: index
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  check:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hubra-app/hubra
          sparse-checkout: app/backend
          token: ${{ secrets.HUBRA_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --no-deps -r app/backend/requirements.lock
      - name: Download and verify what plugins.hubra.club serves
        working-directory: app/backend
        env:
          FLASK_APP: "hubra:create_app()"
        # A fresh query string, so the Pages CDN can't answer with an older index.
        run: flask plugins check "$INDEX_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
